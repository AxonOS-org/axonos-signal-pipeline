name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p axonos-pipeline-core --target thumbv7em-none-eabihf

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Conformance vectors reproduce exactly
        run: python3 tools/validate_vectors.py
      - name: Integrity manifest verifies
        run: sha256sum -c vectors/SHA256SUMS

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 tools/check_hygiene.py

  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cargo and CITATION versions agree
        run: |
          cargo_v=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          cite_v=$(grep -m1 '^version:' CITATION.cff | sed -E 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
          echo "Cargo.toml=$cargo_v  CITATION.cff=$cite_v"
          if [ "$cargo_v" != "$cite_v" ]; then
            echo "::error::version mismatch: Cargo.toml=$cargo_v CITATION.cff=$cite_v"
            exit 1
          fi

  kani:
    name: Bounded model checking
    runs-on: ubuntu-latest
    # Raised from 30. Seven separate proofs need headroom, and a limit that
    # cancels mid-proof produces a red job that says nothing about the code.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: Prove
        # One invocation per harness, on purpose.
        #
        # The first version ran all seven in a single `cargo kani` call, and
        # when the job hit its time limit the log said only that the operation
        # was cancelled. Which harness was slow, and whether the others had even
        # been attempted, had to be read out of thirty minutes of CBMC output.
        #
        # Run separately, each one reports its own time and a stall is named by
        # the step that stalls. A proof that cannot be attributed is a proof
        # nobody will maintain.
        working-directory: crates/axonos-pipeline-core/kani-proofs
        run: |
          set -e
          for h in \
            pipe_p1_rereference_never_wraps \
            pipe_p2_common_mode_is_removed \
            pipe_p3_baseline_refusal_writes_nothing \
            pipe_p4_identity_filter_is_identity \
            pipe_p5_spatial_filter_saturates \
            pipe_p6_power_ratio_is_total \
            pipe_p7_power_ratio_is_monotone
          do
            echo "::group::$h"
            start=$SECONDS
            cargo kani --default-unwind 8 --harness "$h"
            echo "$h proved in $((SECONDS - start))s"
            echo "::endgroup::"
          done
