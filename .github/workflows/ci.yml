name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p axonos-pipeline-core --target thumbv7em-none-eabihf

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Conformance vectors reproduce exactly
        run: python3 tools/validate_vectors.py
      - name: Integrity manifest verifies
        run: sha256sum -c vectors/SHA256SUMS

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 tools/check_hygiene.py

  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cargo and CITATION versions agree
        run: |
          cargo_v=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          cite_v=$(grep -m1 '^version:' CITATION.cff | sed -E 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
          echo "Cargo.toml=$cargo_v  CITATION.cff=$cite_v"
          if [ "$cargo_v" != "$cite_v" ]; then
            echo "::error::version mismatch: Cargo.toml=$cargo_v CITATION.cff=$cite_v"
            exit 1
          fi

  kani:
    name: Prove ${{ matrix.harness }}
    runs-on: ubuntu-latest
    # One runner per harness, in parallel.
    #
    # Seven harnesses in one job share one budget sequentially, so the
    # expensive one starves the rest: p5 consumed a full hour and p6 and p7
    # never ran at all. Raising the limit was treating the symptom — the defect
    # is that they were queued behind each other. A matrix gives each the whole
    # timeout, names the slow one in the job list, and fails only the harness
    # that fails.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        harness:
          - pipe_p1_rereference_never_wraps
          - pipe_p2_common_mode_is_removed
          - pipe_p3_baseline_refusal_writes_nothing
          - pipe_p4_identity_filter_is_identity
          - pipe_p5_spatial_filter_saturates
          - pipe_p6_power_ratio_is_total
          - pipe_p7_power_ratio_is_monotone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: Prove
        working-directory: crates/axonos-pipeline-core/kani-proofs
        run: |
          start=$SECONDS
          cargo kani --default-unwind 8 --harness ${{ matrix.harness }}
          echo "${{ matrix.harness }} proved in $((SECONDS - start))s"
